name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Breaks Vite's caching by creating a unique .env file on the runner
      - name: Inject Unique Build ID
        run: echo "VITE_APP_BUILD_ID=${{ github.run_id }}" >> .env

      - name: Build
        run: npm run build

      - name: Deploy to Firebase
        # Adding --site explicitly resolves the hosting target assertion error
        run: npx firebase-tools deploy --only hosting --site mcp-project-471a6 --project mcp-project-471a6
        env:
          # Using the modern, non-deprecated Google App Credentials variable
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}