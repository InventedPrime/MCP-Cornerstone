name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Breaks Vite's caching by creating a unique .env file on the runner
      - name: Inject Unique Build ID
        run: echo "VITE_APP_BUILD_ID=${{ github.run_id }}" >> .env

      - name: Build
        run: npm run build

      # The official Google tool handles extracting and passing credentials perfectly
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Deploys hosting smoothly without any buggy or deprecated flags
      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting --project mcp-project-471a6